# ALLAKRO — serveur web de production (nginx). À adapter : nom de domaine, chemins des certificats et du dossier de l'interface.
# Rôle : HTTPS obligatoire, en-têtes de sécurité (HSTS, CSP, anti-cadre…), interface statique, API relayée vers gunicorn.
# Exemple de certificat gratuit : certbot --nginx -d allakro.exemple.com

# Limites de débit par adresse IP (en plus de celles de l'application) : connexion et reste de l'API
limit_req_zone $binary_remote_addr zone=allakro_connexion:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=allakro_api:10m rate=600r/m;

# HTTP : tout est redirigé vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name allakro.exemple.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name allakro.exemple.com;

    ssl_certificate     /etc/letsencrypt/live/allakro.exemple.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allakro.exemple.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 1m;          # l'API ne reçoit que de petits documents JSON

    # --- En-têtes de sécurité (always : aussi sur les réponses d'erreur) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # CSP de l'interface (identique à la balise meta du build, plus frame-ancestors qu'une balise ne peut pas exprimer)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    root /var/www/allakro/dist;       # dossier produit par « npm run build » dans frontend/
    index index.html;

    # --- API : relayée vers gunicorn (127.0.0.1:8000) ---
    location /api/ {
        limit_req zone=allakro_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx est le seul mandataire : il remplace l'en-tête reçu par l'adresse réelle du client (anti-falsification)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /api/v1/auth/login/ {
        limit_req zone=allakro_connexion burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Interface : fichiers statiques ; toute autre adresse renvoie index.html (routes de l'application) ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # les add_header d'un bloc remplacent ceux du serveur : on répète les en-têtes de sécurité
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    }

    # Fichiers cachés, sauvegardes et sources ne sont jamais servis
    location ~ /\.(?!well-known) { deny all; }
}
