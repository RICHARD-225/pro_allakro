# Contrôle automatique à chaque envoi sur GitHub : tests, migrations, sécurité de déploiement, vulnérabilités, qualité du code.
name: Contrôle ALLAKRO

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: allakro
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: allakro_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U allakro" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: cle-secrete-uniquement-pour-les-tests-0123456789-0123456789
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DB_NAME: allakro_ci
      DB_USER: allakro
      DB_PASSWORD: ci-test-password
      DB_HOST: localhost
      DB_PORT: '5432'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pip-audit
      - name: Vérifications Django
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Contrôle de déploiement (réglages de production)
        run: python manage.py check --deploy
        env:
          DEBUG: 'False'
          SECURE_PROXY_SSL: 'True'
          ALLOWED_HOSTS: allakro.exemple.com
          CORS_ALLOWED_ORIGINS: https://allakro.exemple.com
      - name: Tests
        run: python manage.py test apps --parallel 1
      - name: Vulnérabilités des dépendances Python
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Qualité du code (identifiants non définis, hooks React)
        run: npm run lint
      - name: Build de production
        run: npm run build
      - name: Vulnérabilités des dépendances de production
        run: npm audit --omit=dev
