# ALLAKRO sur Render (offre gratuite) : interface (site statique) + API Django. La base PostgreSQL est chez Neon (gratuit) :
# son adresse se colle dans DATABASE_URL. Guide pas à pas : deploy/RENDER.md.
#
# ⚠ Les noms des deux services déterminent leurs adresses (https://<nom>.onrender.com). Si un nom est déjà pris, Render ajoute un
#   suffixe : changez alors le nom ici ET les trois endroits qui le répètent (destination de la redirection /api, CORS_ALLOWED_ORIGINS,
#   CSRF_TRUSTED_ORIGINS, FRONTEND_URL).
services:
  # ---------------------------------------------------------------- API Django
  - type: web
    name: allakro-richard225-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Pas de terminal sur l'offre gratuite : migrations et création des comptes Big Boss se font à chaque démarrage (sans danger).
    startCommand: python manage.py migrate --noinput && python manage.py initialiser_production && gunicorn PRoAll.wsgi:application --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT --access-logfile - --error-logfile -
    healthCheckPath: /api/v1/sante/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      # Les requêtes de l'interface arrivent via la redirection /api du site statique : son adresse est l'origine du navigateur
      - key: ALLOWED_HOSTS
        value: allakro-richard225-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://allakro-richard225-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://allakro-richard225-web.onrender.com
      - key: FRONTEND_URL
        value: https://allakro-richard225-web.onrender.com
      # HTTPS terminé par Render (en-tête X-Forwarded-Proto)
      - key: SECURE_PROXY_SSL
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      # Un seul processus : le cache en mémoire suffit (pas de Redis)
      - key: CACHE_BACKEND
        value: locmem
      # Base Neon : coller l'adresse de connexion (« Connection string », avec sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Comptes Big Boss créés au premier démarrage (laisser le second vide s'il n'est pas utilisé)
      - key: BIG_BOSS_1_EMAIL
        sync: false
      - key: BIG_BOSS_1_MOT_DE_PASSE
        sync: false
      - key: BIG_BOSS_1_PRENOM
        sync: false
      - key: BIG_BOSS_1_NOM
        sync: false
      - key: BIG_BOSS_2_EMAIL
        sync: false
      - key: BIG_BOSS_2_MOT_DE_PASSE
        sync: false
      - key: BIG_BOSS_2_PRENOM
        sync: false
      - key: BIG_BOSS_2_NOM
        sync: false

  # ---------------------------------------------------------------- Interface React
  - type: web
    name: allakro-richard225-web
    runtime: static
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci --legacy-peer-deps && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      # Pas de serveur de courrier pour ce test : le lien « Mot de passe oublié » est remplacé par « Contactez votre administrateur »
      - key: VITE_MOT_DE_PASSE_OUBLIE
        value: "false"
    routes:
      # L'API est atteinte sur la même adresse que l'interface (cookies de session et protection CSRF sans configuration croisée)
      - type: rewrite
        source: /api/*
        destination: https://allakro-richard225-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
